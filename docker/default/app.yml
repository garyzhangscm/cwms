version: '2'
services:

  layoutservice:
      image: garyzhangscm/cwms-layoutserver
      ports:
          - "8180:8180"
      environment:
          SPRING_PROFILE: "dev"
          CONFIGSERVER_URI: "http://configserver:8888"
          DATABASE_URL: "${MES_DATABASE_URL:?Set MES_DATABASE_URL outside Git}"
          CONFIGSERVER_PORT:   "8888"
          DATABASESERVER_PORT: "3306"
          ENCRYPT_KEY: "${ENCRYPT_KEY:?Set ENCRYPT_KEY outside Git}"
          COMPOSE_PROJECT_NAME: "CWMS-APP"

  authservice:
      image: garyzhangscm/cwms-authserver
      ports:
          - "8280:8280"
      environment:
          SPRING_PROFILE: "default"
          CONFIGSERVER_URI: "http://configserver:8888"
          DATABASE_URL: "${MES_DATABASE_URL:?Set MES_DATABASE_URL outside Git}"
          CONFIGSERVER_PORT:   "8888"
          DATABASESERVER_PORT: "3306"
          ENCRYPT_KEY: "${ENCRYPT_KEY:?Set ENCRYPT_KEY outside Git}"
          COMPOSE_PROJECT_NAME: "CWMS-APP"