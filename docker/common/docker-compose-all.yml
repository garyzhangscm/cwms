
version: '2'
services:
  eurekaserver:
    image: garyzhangscm/cwms-eurekasvr
    ports:
      - "8761:8761"

  configserver:
    image: garyzhangscm/cwms-confsvr
    ports:
       - "8888:8888"
    environment:
      ENCRYPT_KEY: "${ENCRYPT_KEY:?Set ENCRYPT_KEY outside Git}"
      COMPOSE_PROJECT_NAME: "CONFIGURATION"
  database:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - 3306:3306
#    networks:
#      - vpcbr
     #   ipv4_address: server.example.invalid
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:}"
      COMPOSE_PROJECT_NAME: "DATABASE"

# adminer is a standard dock to configure database
# database name will be "database", which is the service name
# user: root
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    environment:
      COMPOSE_PROJECT_NAME: "DATABASE"
