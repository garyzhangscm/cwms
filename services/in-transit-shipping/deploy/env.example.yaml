# Merge into the FAY staging outbound container after verifying its current image digest.
# Mount an existing persistent directory at /var/lib/cwms-in-transit.
# Seed rules.json from config/fay-rules.example.json once; do not overwrite saved rules on restart.
# Use one replica with this file-backed configuration. A shared multi-replica config store is outside this release.
env:
  - name: FAY_TRANSIT_ENABLED
    value: "true"
  - name: FAY_TRANSIT_COMPANY_ID
    value: "1"
  - name: FAY_TRANSIT_WAREHOUSE_ID
    value: "1"
  - name: FAY_TRANSIT_CUSTOMER_IDS
    value: "1,25"
  - name: FAY_TRANSIT_LOCATION_IDS
    value: "16169"
  - name: FAY_TRANSIT_CONFIG_FILE
    value: /var/lib/cwms-in-transit/rules.json
  - name: FAY_TRANSIT_AUTH_URL
    value: http://apigateway:5555/api/auth
